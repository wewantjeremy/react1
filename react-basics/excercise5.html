<!DOCTYPE html>
<html>
<head>
    <title>Excercise 5</title>
</head>
<style>
    .on{
        font-family: arial;
     background-color: rgb(25, 135, 84);   
     border-radius: 10px;
     color: white;
     font-size: 30px;
     padding: 15px 25px;
     border: none;
    }
       .off{
        font-family: arial;
     background-color: rgb(135, 25, 25);   
     border-radius: 10px;
     color: white;
     font-size: 30px;
     padding: 15px 25px;
     border: none;
    }
</style>
<body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev@3.2.1/external-library.js"></script>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>
    <script type="text/babel">
function App() {
    const [isButtonOn, setIsButtonOn] = React.useState(true);
    return(
        <button className={isButtonOn ? "on" : "off"}
        onClick={() => setIsButtonOn(!isButtonOn)}>
        {isButtonOn ? "On" : "Off"}</button>
    );
}
const container = document.querySelector('.js-container');
ReactDOM.createRoot(container).render(<App />);
</script>
</body>
</html>
