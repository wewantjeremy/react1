<!DOCTYPE html>
<html>
  <head>
    <title></title>
    <style>
        body {
            font-size: 24px;
            font-family: Arial;
            line-height: 2;
            background: radial-gradient(blue, violet);
        }
        .box {
            border-radius: 5px;
            padding: 7px 10px;
            margin-top: 10px;
            margin-right: 5px;
        }
        .button {
            border-radius: 6px;
            color: white;
            font-size: 12px;
            padding: 10px 17px;
            border: none;
            background-color: rgb(0, 123, 255);
            margin-right: 8px;
        }
    </style>
  </head>
  <body>
    Hello, welcome to my website
    <br />
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev@3.2.1/external-library.js"></script>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>
    <script type="text/babel">
    function InputBox({ placeholder, type }) {
       return <input className="box" placeholder={placeholder} type={type} size="30" />
    }           
    function App() {
        const [isButtonOn, setIsButtonOn] = React.useState(true);   
        return (
            <div>    
            <InputBox placeholder="Email"/> 
            <br />
            <InputBox placeholder="Password" type={isButtonOn ? "password" : "text"}/>
            <button onClick={() => setIsButtonOn(!isButtonOn)}>{isButtonOn ? "Show" : "Hide"}</button>
            <br />
            <button className="button">Login</button>
            <button className="button">Sign Up</button>
            </div>
            );
        }
        const container = document.querySelector('.js-container');
ReactDOM.createRoot(container).render(<App />);
</script>
</body>
</html>
